[workspace]
name = "pixi_ros2_rolling"
version = "0.1.0"
description = "Dependencies to build ROS 2 on Windows and Linux (aligned with Ubuntu 26.04 Resolute)"
authors = ["Chris Lalancette <clalancette@gmail.com>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[target.win-64.dependencies]
7zip = "==26.00"
osrf_pycommon = "==0.2.1"
pyqt6 = "==6.11.0"
pyqt6-sip = "==13.10.0"

[target.win-64.activation.env]
QT_QPA_PLATFORM_PLUGIN_PATH="%cd%\\.pixi\\envs\\default\\Library\\plugins\\platforms"

[target.linux-64.dependencies]
binutils_linux-64 = "==2.45.1"
freeglut = "==3.2.2"
freeimage = "==3.18.0"
gcc_linux-64 = "==15.2.0"
glew = "==2.2.0"
gxx_linux-64 = "==15.2.0"
libacl = "==2.3.2"
libgles-devel = "==1.7.0"
libgl-devel = "==1.7.0"
libglx-devel = "==1.7.0"
libglu = "==9.0.3"
libopengl-devel = "==1.7.0"
lttng-ust = "==2.13.9"
make = "==4.4.1"
mesalib = ">=24.0,<26"
pkgconfig = "==1.5.5"
xorg-libxaw = "==1.0.14"
zziplib = "==0.13.69"

[dependencies]
# Tooling dependencies
colcon-cmake = ">=0.2.28"
